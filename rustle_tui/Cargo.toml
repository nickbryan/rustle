[package]
name = "rustle_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
rustle_core = { version = "0.1.0", path = "../rustle_core" }
rustle_state = { version = "0.1.0", path = "../rustle_state" }
crossterm = { version = "0.29.0", features = ["event-stream"] }
backtrace = "0.3.76"
anyhow = "1.0.100"
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
futures = "0.3.31"
