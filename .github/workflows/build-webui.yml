name: Build WebUI
on:
  workflow_run:
    workflows: ["Test All"]
    branches: [main]
    types:
      - completed

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rustle_webui
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Install Dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Push to website
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: 'rustle_webui/dist'
          destination-github-username: 'nickbryan'
          destination-repository-name: 'nickbryan.co.uk'
          target-directory: 'static/rustle'
          commit-message: ${{ github.event.head_commit.message }}
